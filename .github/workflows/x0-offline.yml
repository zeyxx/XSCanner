name: X0 offline validation

on:
  pull_request:
    branches: ['agent/hermes/xscanner-sauvegarde', 'docs/x0-evidence-reconciliation-20261122', 'fix/x0-mint-budget-20261122', 'fix/x0-counts-cache-20261122', 'fix/x0-token2022-audit-20261122', 'fix/x0-prune-npm-20261122']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve candidate lockfile for review (temporary only)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.stringify(JSON.parse(readFileSync("package-lock.json", "utf8")));
            for (let i = 0; i < lock.length; i += 3000) {
              console.log("XSCANNER_LOCK_PART " + String(i / 3000).padStart(3, "0") + " " + lock.slice(i, i + 3000));
            }
          '
      - name: Install dependencies
        run: npm ci
      - name: Verify installed dependency roots
        run: npm ls --depth=0
      - name: TypeScript check
        run: npm run build
      - name: CLI TypeScript check (all scripts, no execution)
        run: npm run check:cli
      - name: Unit tests (no keys or paid providers)
        run: npm test
      - name: Dependency advisories (read-only, informational; not a promotion gate)
        run: node --import tsx scripts/audit-deps.ts
