name: X0 offline validation

on:
  pull_request:
    branches: ['agent/hermes/xscanner-sauvegarde', 'docs/x0-evidence-reconciliation-20261122', 'fix/x0-mint-budget-20261122', 'fix/x0-counts-cache-20261122', 'fix/x0-token2022-audit-20261122', 'fix/x0-prune-npm-20261122', 'fix/x0-vitest-upgrade-20261122', 'fix/x0-token2022-combinations-20261122']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify installed dependency roots
        run: npm ls --depth=0
      - name: Prove X compare CLI dry-run needs no .env or data
        run: |
          test ! -e .env
          test ! -e data/prices.jsonl
          env -u GETXAPI_KEY -u X_API_BEARER_TOKEN npm run compare:x -- --dry-run --limit 2
          env -u GETXAPI_KEY -u X_API_BEARER_TOKEN npm run compare:x
          test ! -e data/compare-x.jsonl
      - name: TypeScript check
        run: npm run build
      - name: CLI TypeScript check (all scripts, no execution)
        run: npm run check:cli
      - name: Unit tests (no keys or paid providers)
        run: npm test
      - name: Dependency advisories (read-only, informational; not a promotion gate)
        run: node --import tsx scripts/audit-deps.ts
