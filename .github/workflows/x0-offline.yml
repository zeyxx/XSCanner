name: X0 offline validation

on:
  pull_request:
    branches: ['agent/hermes/xscanner-sauvegarde']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run build
      - name: Unit tests (no keys or paid providers)
        run: npm test
